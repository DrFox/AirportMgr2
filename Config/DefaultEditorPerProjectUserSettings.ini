[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
; Start the MCP server with the editor rather than waiting for someone to type
; ModelContextProtocol.StartServer in the console.
;
; Claude Code connects to its MCP servers ONCE, at session start. A server that has to be
; started by hand is therefore dead for any session that began before somebody remembered
; - which is exactly what happened on 2026-09-02, and cost three rounds of guessing at
; editor state that one call could have read.
bAutoStartServer=True

ServerPortNumber=8000
ServerUrlPath=/mcp

; Meta-tool discovery: tools/list returns only list_toolsets, describe_toolset and
; call_tool, and the rest are found on demand. Hundreds of tool schemas therefore stay OUT
; of the prompt while remaining callable on the same turn, and the prompt cache stays warm.
; Default is already true; pinned because turning it off would quietly cost a great deal of
; context every session.
bEnableToolSearch=True
