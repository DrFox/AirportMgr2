; The ONLY content path outside an asset, and the point of it being here rather than in C++.
;
; Eight literal /Game/ paths used to live in constructors, resolved by ConstructorHelpers at
; CDO time. They worked, and they were invisible to the editor - so moving a content folder
; left every one of them pointing at nothing, with only a startup log line to say so.
;
; Everything BEHIND this line is a real asset reference inside DA_AirsideContent, which the
; editor repoints like any other. Only this line has to be maintained by hand, and only when
; the content set itself moves. Project Settings > Plugins > Airside edits it.
[/Script/Airside.AirsideSettings]
Content=/Game/DA_AirsideContent.DA_AirsideContent
