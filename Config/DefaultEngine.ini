; The plugin was called RoadNet until it grew aircraft, stands and routing and the name
; stopped describing it. Assets saved before that carry /Script/RoadNet.<Class> in their
; import tables - M_Starter's RoadNetworkActor, and all three data assets - and without
; these the level loads with the actor silently missing.
;
; They stay until every affected asset has been re-saved under the new name, and there is
; no cost to leaving them longer.
[CoreRedirects]
+PackageRedirects=(OldName="/Script/RoadNet",NewName="/Script/Airside")
+PackageRedirects=(OldName="/Script/RoadNetEditor",NewName="/Script/AirsideEditor")
+PackageRedirects=(OldName="/Script/RoadNetTests",NewName="/Script/AirsideTests")


; PRESENTATION IS SYNCHRONISED WITH THE DISPLAY, because an aeroplane crossing the screen at
; a steady speed is this game's most common sight and unsynchronised presentation makes it
; judder. An even cadence is also what ARoadNetworkActor's delta evening assumes: that fix
; pays out an even step per frame, which is only smooth if the frames are PRESENTED evenly
; too, so the two belong together.
;
; THIS ALONE DID NOT FIX THE REPORTED JUDDER. Measured with vsync locked - 70% of frames on
; an exact two-refresh cadence, 0.79 ms stdev - and it still juddered. The cause was the
; simulation delta, not the display cadence; see ARoadNetworkActor::DeltaSmoothingRate. This
; stays because uneven presentation is real and would undo that fix, not because it was it.
;
; NOT A FRAME RATE REQUIREMENT. This adapts to whatever display the player has - it is the
; engine matching their refresh rate, not the player matching ours - and any synchronised
; cadence measures 0.0% error, whether that lands at 60, 80, 120 or 239. The project set no
; frame pacing at all before this: engine defaults are bSmoothFrameRate=false and r.VSync=0.
;
; The cost is up to one frame of input latency. This game is a builder driven by a cursor,
; not a shooter, and the aircraft are the thing being watched - so the trade is the right way
; round here and would not be in a twitch game.
;
; IN [SystemSettings], which is the conventional home for a plain console variable. An
; earlier note here claimed [/Script/Engine.RendererSettings] ignores them; that was WRONG -
; the standalone log shows it applying r.VSync:1 from exactly that section. The editor read 0
; only because the engine's own [SystemSettingsEditor] sets it there, and the editor uses
; r.VSyncEditor regardless.
;
; AND THE EDITOR HAS ITS OWN SWITCH. FSlateRHIRenderer::IsVSyncRequired reads r.VSyncEditor
; when GIsEditor and r.VSync otherwise, so PIE ignores r.VSync entirely. Both are set, because
; a judder that only reproduces outside PIE is a judder nobody will catch during development.
[SystemSettings]
r.VSync=1


[SystemSettingsEditor]
r.VSyncEditor=1
