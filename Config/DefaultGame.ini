ProjectID=45487A9C45060BE383CBAA8B9CC97686

; ── MCP Automation Bridge (editor-only dev tooling) ─────────────────────────
; The plugin itself lives in Plugins/McpAutomationBridge and is gitignored, so
; this section is inert for anyone who has not installed it.
;
; Loopback-only with no capability token: the transport refuses to bind a
; non-loopback interface unless a token is also required, so this combination
; is reachable only from 127.0.0.1. Any local process can drive the editor,
; which is the normal trade on a single-user dev machine. Set
; bRequireCapabilityToken=True and supply CapabilityToken to tighten it.
[/Script/McpAutomationBridge.McpAutomationBridgeSettings]
bEnableNativeMCP=True
NativeMCPPort=3000
bLoadAllToolsOnStart=True
bAlwaysListen=True
ListenHost=127.0.0.1
bAllowNonLoopback=False
bRequireCapabilityToken=False

; AirportOps definitions are primary assets scanned by type so UOpsCatalog can enumerate
; them without loading the world. One entry per UOpsDefinition subclass; a class missing
; here shows up as "0 <Type>(s)" in the OpsCatalog log line.
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="Scenario",AssetBaseClass="/Script/AirportOps.Scenario",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Ops")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
+PrimaryAssetTypesToScan=(PrimaryAssetType="AirlineDefinition",AssetBaseClass="/Script/AirportOps.AirlineDefinition",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Entities")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))

; The UI style asset - six semantic colour slots, fonts, metrics and the icon map.
; UAirportMgrUISettings::ResolveStyle falls back to UUIStyle's CDO if this is absent or
; fails to load, so the bar renders in the declared palette either way.
[/Script/AirportMgr.AirportMgrUISettings]
Style=/Game/UI/DA_UIStyle.DA_UIStyle

; TEMPORARY, for testing: key 7 ("land an aircraft") lands this type instead of the
; content set's default, so a particular aeroplane can be put on the runway without
; waiting for the flight board to offer one.
;
; READ BY THE LAND KEY AND NOTHING ELSE. Offers and their arrivals still resolve their own
; type, so this cannot become the game's behaviour by being left here - and the log names
; the type on every press. DELETE THIS LINE to go back to the default.
;
; POINTED AT PLANE4 ON 2026-09-19, and it asks more of the airport again. The ladder this
; line walks up is deliberate: plane2 takes grass and 366 m, plane3 wants tarmac and 1,402 m
; and 15 m of corner radius, and a 737-800 publishes a 2,316 m take-off field length and
; 15.9 m of corner. Every one of those is a REFUSAL with a reason in the log - "Land: ..."
; followed by RunwayAdmission's Describe - not a silent nothing. Swap the line back to
; DA_Aircraft_Plane3 or _Plane2 to test on a shorter strip.
;
; IT IS ALSO THE ONLY TYPE WITH RETRACTABLE GEAR, so this key is currently the only way to
; see the gear cycle at all - take off, and the legs come up passing 90 m.
[/Script/AirportMgr.RoadBuildController]
LandAircraftType=/Game/Entities/DA_Aircraft_Plane4.DA_Aircraft_Plane4
