; ── MCP Automation Bridge (editor-only dev tooling) ─────────────────────────
; The plugin itself lives in Plugins/McpAutomationBridge and is gitignored, so
; this section is inert for anyone who has not installed it.
;
; Loopback-only with no capability token: the transport refuses to bind a
; non-loopback interface unless a token is also required, so this combination
; is reachable only from 127.0.0.1. Any local process can drive the editor,
; which is the normal trade on a single-user dev machine. Set
; bRequireCapabilityToken=True and supply CapabilityToken to tighten it.
[/Script/McpAutomationBridge.McpAutomationBridgeSettings]
bEnableNativeMCP=True
NativeMCPPort=3000
bLoadAllToolsOnStart=True
bAlwaysListen=True
ListenHost=127.0.0.1
bAllowNonLoopback=False
bRequireCapabilityToken=False

; AirportOps definitions are primary assets scanned by type so UOpsCatalog can enumerate
; them without loading the world. One entry per UOpsDefinition subclass; a class missing
; here shows up as "0 <Type>(s)" in the OpsCatalog log line.
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="Scenario",AssetBaseClass="/Script/AirportOps.Scenario",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Ops")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
